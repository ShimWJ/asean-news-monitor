name: Keep Streamlit App Awake

on:
  schedule:
    # 11시간마다 실행
    - cron: "17 */11 * * *"

  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Visit Streamlit app
        env:
          STREAMLIT_APP_URL: "https://asean-news-monitor.streamlit.app/"
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");

          const appUrl = process.env.STREAMLIT_APP_URL;

          if (!appUrl) {
            console.error("STREAMLIT_APP_URL is not set.");
            process.exit(1);
          }

          async function main() {
            const browser = await chromium.launch({
              headless: true,
            });

            const page = await browser.newPage();

            console.log(`Opening Streamlit app: ${appUrl}`);

            await page.goto(appUrl, {
              waitUntil: "domcontentloaded",
              timeout: 60000,
            });

            await page.waitForTimeout(5000);

            const wakeButton = page.locator("button", {
              hasText: /get this app back up|wake|yes/i,
            });

            const buttonCount = await wakeButton.count();

            if (buttonCount > 0) {
              console.log("Sleeping page detected. Clicking wake-up button.");

              await wakeButton.first().click({
                timeout: 30000,
              });

              await page.waitForTimeout(30000);
            } else {
              console.log("Wake-up button not found. App is probably already awake.");
              await page.waitForTimeout(15000);
            }

            const title = await page.title();
            console.log(`Page title: ${title}`);

            await browser.close();
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
